name: Build App
on:
  push:
    branches:
      - '**'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  refs:
    name: Prepare CI Environment
    runs-on: ubuntu-22.04
    outputs:
      sha_short: ${{ steps.refs.outputs.sha_short }}
      short_ref: ${{ steps.refs.outputs.short_ref }}
      version: ${{ steps.refs.outputs.version }}
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
      - name: Set outputs
        id: refs
        run: |
          export BRANCH=${GITHUB_REF#refs/*/}
          export BRANCHTRANSLATED=$(echo ${BRANCH} | tr '/' '_')
          export VERSION=${BRANCHTRANSLATED}_$(git rev-parse --short=12 HEAD)
          echo "short_ref=${BRANCHTRANSLATED}" >> $GITHUB_OUTPUT
          echo "sha_short=SHA-$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: refs
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: OpenBK7238
            variant: irRemoteESP
    steps:
      - name: Source checkout
        uses: actions/checkout@v4

      - name: Run make
        run: make APP_VERSION=${{ needs.refs.outputs.version }}_${{ matrix.variant }} APP_NAME=${{ matrix.platform }} VARIANT="${{ matrix.variant }}" ${{ matrix.platform }}

      - name: Save build assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ needs.refs.outputs.version }}_${{ matrix.platform }}_${{ matrix.variant }}
          path: |
            output/${{ needs.refs.outputs.version }}_${{ matrix.variant }}/${{ matrix.platform }}_QIO_${{ needs.refs.outputs.version }}_${{ matrix.variant }}.bin
            output/${{ needs.refs.outputs.version }}_${{ matrix.variant }}/${{ matrix.platform }}_UA_${{ needs.refs.outputs.version }}_${{ matrix.variant }}.bin
            output/${{ needs.refs.outputs.version }}_${{ matrix.variant }}/${{ matrix.platform }}_${{ needs.refs.outputs.version }}_${{ matrix.variant }}.rbl
          if-no-files-found: warn
